name: Publish GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aero7-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation source
        uses: actions/checkout@v4

      - name: Publish wiki pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "$wiki_url" >/dev/null 2>&1; then
            echo "GitHub Wiki has no first page yet; keeping versioned wiki source in the repository."
            exit 0
          fi
          git clone "$wiki_url" published-wiki
          rsync -a --delete --exclude=.git wiki/ published-wiki/
          cd published-wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "Publish wiki from ${GITHUB_SHA}"
          git push origin HEAD:master
