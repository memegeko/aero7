name: Source checks

on:
  pull_request:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install validation tools
        run: >-
          pacman -Syu --noconfirm --needed
          git imagemagick python qt6-declarative ripgrep shellcheck

      - name: Check out Aero7 ISO
        uses: actions/checkout@v7
        with:
          path: aero7-iso

      - name: Read pinned Aero7 shell revision
        id: sources
        working-directory: aero7-iso
        run: |
          shell_commit="$(sed -n 's/^aero7_shell_commit=//p' sources.lock)"
          [[ "$shell_commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'shell_commit=%s\n' "$shell_commit" >>"$GITHUB_OUTPUT"

      - name: Check out pinned Aero7 shell
        uses: actions/checkout@v7
        with:
          repository: memegeko/aero7-shell
          ref: ${{ steps.sources.outputs.shell_commit }}
          path: aero_desktop

      - name: Run source gate
        working-directory: aero7-iso
        run: ./scripts/check.sh

      - name: Confirm public-release hold is active
        working-directory: aero7-iso
        run: |
          if ./scripts/check-public-release.sh; then
            echo "The public-release gate unexpectedly passed." >&2
            exit 1
          fi
          grep -Fqx 'public_release_status=blocked' config/public-release.conf
