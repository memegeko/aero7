name: Feature request
description: Suggest a focused improvement to Aero7
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result rather than only an implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer
        - First-boot setup
        - Desktop integration
        - Applications
        - Virtual machine support
        - Documentation
        - Build or release tooling
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: Asset and licensing impact
      description: Identify any proposed artwork, font, sound, or third-party code and its redistribution license. Write “None” if not applicable.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This request does not require weakening disk-safety controls.
          required: true
