title    Aero7 Setup (debug, no splash)
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% plymouth.enable=0 loglevel=7 systemd.log_level=debug systemd.show_status=1 rd.systemd.show_status=1 console=ttyS0,115200n8 console=tty0
